<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- 웹폰트는 이 저장소 안에 내려받아 같은 origin 에서 낸다(§I5) — 느리거나
         막힌 CDN 이 첫 페인트를 늦춰서는 안 되고("웹폰트가 늦게 와도 …
         투표는 끝까지 되어야 한다", PRODUCT.md), 이 앱의 전제 자체가
         "누가 투표했는지 제3자가 최소한으로만 안다"는 것이므로 모든 투표자의
         IP 를 Google·jsDelivr 에 그대로 넘기는 것과도 맞지 않는다. 실제
         @font-face 는 src/client/styles.css 에 있다. -->
    <!-- 기본은 종이 세계(결과·관리자) 색 — 투표 경로는 아래 인라인 스크립트가
         첫 페인트 전에 덮어쓴다. 바탕은 검정 상수라(2026-09-03 계약 수정:
         Drenched·검정) VoteFlow 마운트 이후에도 이 값 그대로 유지된다 —
         useVoteWorldGround 는 더 이상 값을 바꾸지 않고, 화면을 벗어날 때
         종이색으로 되돌리기만 한다. -->
    <meta name="theme-color" content="#f5f2e8" />
    <!-- 사이트 이름의 원본은 src/client/brand.ts(SITE_TITLE)다. 여기 값은
         React 가 마운트되기 전 첫 페인트용 사본이라 둘이 같아야 한다. 설문
         화면에 들어가면 useDocumentTitle 이 설문 이름으로 덮어쓴다. -->
    <title>AN-FORM | JAEHYUN.DEV</title>

    <!-- 검색에 노출하지 않는다. 이 사이트가 다루는 것은 한 기관의 설문
         링크이고, 그 주소가 검색 결과에 뜨는 것은 설문을 돌린 사람이 링크를
         누구에게 줄지 고르는 일 자체를 무의미하게 만든다. 헤더
         (public/_headers 의 X-Robots-Tag)가 자산까지 포함해 모든 응답을
         덮고, 이 태그는 HTML 을 파싱하는 크롤러를 한 번 더 덮는다. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />

    <!-- 공유 카드(주로 카카오톡). 여기 값들은 "사이트"의 기본값이고, 설문
         링크(/s/:id)로 들어오는 요청에는 Worker 가 그 설문의 이름·설명으로
         이 태그들을 갈아 끼운다(src/server/shell.ts) — 카카오톡 스크래퍼는
         자바스크립트를 돌리지 않아서 React 가 나중에 바꾸는 것은 보지
         못한다. og:url 은 절대 URL 이어야 하는데 배포 도메인이 코드에
         없으므로 그 값도 Worker 가 요청 주소를 보고 채운다. 여기 상대
         경로는 스크래퍼가 아닌 사람이 이 파일을 열었을 때를 위한 자리
         표시다.

         제목·설명은 첫 화면과 같은 영어다 — 이 기본값이 실제로 쓰이는 곳은
         첫 화면 하나뿐이고(설문 링크는 Worker 가 그 설문의 이름·설명으로
         갈아 끼운다), 설명이 빈 설문에 쓰이는 한국어 기본 문장은
         src/server/shell.ts 의 FALLBACK_DESCRIPTION 에 따로 있다.

         og:image 는 두지 않는다 — 이 저장소는 이미지 자산을 쓰지 않고
         (DESIGN.md §Don't), 카드에 그림이 없으면 카카오톡은 제목과 설명만
         있는 작은 카드로 보여준다. 링크를 받은 사람이 알아야 하는 것은
         무슨 투표인가 하나뿐이고 그것은 제목이 말한다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AN-FORM" />
    <meta property="og:title" content="AN-FORM" />
    <meta property="og:description" content="Anonymous surveys where a name and an answer are never linked." />
    <meta property="og:url" content="/" />
    <meta name="description" content="Anonymous surveys where a name and an answer are never linked." />
  </head>
  <body>
    <!-- body 는 CSS 가 로드되는 즉시 --paper(종이색)로 칠해진다(§기본 요소) —
         React 가 아직 마운트되지 않은 그 찰나에도 투표 경로에서는 검정 대신
         종이색이 잠깐 비치면 안 된다("그 잠깐"이 인앱 브라우저에서는 짧지
         않다). 그래서 이 스크립트가, CSS·React 둘 다보다 먼저, document.body
         가 파싱되는 즉시 동기적으로 검정 바탕을 칠한다. VoteFlow 의
         useVoteWorldGround 가 마운트 이후를 이어받고, 화면을 벗어나면
         종이색으로 되돌린다. -->
    <script>
      (function () {
        var path = location.pathname
        if (path !== '/' && !/^\/s\/[^/]+\/?$/.test(path)) return
        var ground = 'rgb(10, 10, 10)'
        document.documentElement.style.backgroundColor = ground
        document.body.style.backgroundColor = ground
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', ground)
      })()
    </script>
    <!--
      DESIGN DIRECTION CONTRACT — seed key 0559c2f4 (scope direction, mode operate, index 6)

      THESIS: 투표용지는 이름의 목록이고, 벽보는 그 목록을 크기만으로 읽히게
      만드는 형식이다. 이 화면은 설문 폼이 아니라 한 문항이 한 장의 벽보다.
      카드도, 박스도, 아이콘도 없다.

      OWN-WORLD: Drenched·검정(사용자 지정, 2026-09-03 — 초안의 청록→자주
      이동은 폐기). 화면 전체가 검정(#0A0A0A)이고 잉크는 단 하나(#F5F2E8,
      바랜 종이색). 바탕은 처음부터 끝까지 움직이지 않는다 — 진행은 색이
      아니라 문항 번호(「n / 총 문항수」)의 타이포그래피 스케일이 짊어진다.
      약한 정보는 회색이 아니라 잉크의 불투명도 0.78(투표 세계)/0.85(종이
      세계)로만 만든다 — 초안의 0.62 는 청록 바탕에서 3.62:1 까지 떨어져
      크래프트 바닥(4.5:1)에 못 미쳐 폐기했다(2026-09-03 계약 수정; 검정
      바탕에서는 0.78 이 10.75:1). 선이나 박스로 가두지 않는다 — 보기는
      카드가 아니라 목록의 한 줄이고, 구분선·테두리·카드·그림자 없이 여백과
      굵기만으로 나눈다. 선택은 아이콘이 아니라 타이포그래피로: 고른 항목은
      굵기·크기가 오르고 나머지는 흐려진다. 관리자·결과 화면은 같은 체계를
      반전해서 쓴다 — 종이 바탕(#F5F2E8)에 검정 잉크. 색상 강조는 없다,
      유일한 예외는 관리자 점검 화면의 정합성 경보뿐이다.

      STORY: 링크를 열어 → 이름·학번을 적고 → 벽보를 한 장씩 넘기며 답하고
      → 마지막에 찍은 것을 한 화면에서 확인한 뒤 → 한 번에 제출한다.

      FIRST VIEWPORT: 검정으로 가득 찬 화면. 표지에는 상단 상태 줄이 없다
      — 「투표 중」은 화면이 이미 말하는 것이고, 「1 / 7」은 아직 1번 문항에
      들어서지 않아 세울 수 없다. 카운터는 문항 화면에 들어선 뒤에야 우상단에
      크게 선다(문항 화면의 상태 줄에는 그 번호 하나뿐이다). 중앙보다 위,
      왼쪽 정렬 제목 — Wanted Sans 900,
      clamp(2.5rem, 9vw, 4.5rem). 이름·학번은 박스가 아니라 밑줄뿐인 입력란.
      하단엔 폭 전체 「시작하기」, 잉크로 채우고 글자는 바탕색으로 뚫는다.

      FORM: 문항 전환마다 제목·보기가 아래에서 위로 22px 올라오며 28ms씩
      계단식으로 나타난다 — cubic-bezier(0.16, 1, 0.3, 1). 뒤로 갈 땐 반대
      방향. 바탕은 검정으로 고정이라 전환은 전적으로 타입이 짊어진다.
      prefers-reduced-motion: reduce 에서는 즉시 교체한다.
    -->
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
